[package]
name = "agentrec"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../README.md"
keywords = ["coding-agents", "provenance", "blame", "undo", "claude-code"]
categories = ["development-tools", "command-line-utilities"]
description = "Flight recorder for coding agents: who broke my repo — me or the agent?"

[[bin]]
name = "agentrec"
path = "src/main.rs"

[dependencies]
agentrec-core = { path = "../agentrec-core", version = "0.2.0" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ignore = "0.4"
notify = "6"
walkdir = "2"
libc = "0.2"
ctrlc = { version = "3", features = ["termination"] }
toml = "0.8"
# Test-body hashing for attest rename detection (Phase 3B). Versions pinned to
# what `Cargo.lock` already carries transitively, so adding these edges moves no
# version. `quote` is here for its `ToTokens` trait — `syn`'s `printing` feature
# provides the impls but the trait itself lives in `quote`.
syn = { version = "2.0.118", features = ["full", "parsing", "visit", "printing"] }
proc-macro2 = "1.0.106"
quote = "1.0.46"

[dev-dependencies]
tempfile = "3"
