[workspace]
members = ["agentrec-core", "cli"]
# Test fixture crate: a package on purpose (the attest cargo adapter runs
# `cargo` against it), never a workspace member. It also carries its own
# empty `[workspace]` table.
exclude = ["cli/tests/fixtures/attest_sample_crate"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/ravi1395/agentrec"
