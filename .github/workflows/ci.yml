name: CI

# J3: per-commit matrix — macOS-14 + Ubuntu-22.04/24.04 must be green.
# fmt + clippy run once (OS-independent); the test matrix runs the workspace
# suite on every platform. #[ignore]d tests (the heavy torture run) are excluded
# by default — the nightly workflow drives those.

on:
  push:
    branches: [main]
  pull_request:
  # Residuals round, Phase 5: the directory-admission machinery this round
  # shipped (macOS rename-in admission + the pre-existing Linux arm) is now
  # testable ONLY on Linux, so the Linux leg is load-bearing infrastructure —
  # yet a push to any branch other than `main` triggers nothing above, and
  # there was no way to run this workflow on demand. `workflow_dispatch` adds
  # a manual button.
  #
  # HONEST caveat, not fixed by this line alone: GitHub only exposes
  # `workflow_dispatch` for a workflow that is already on the repo's default
  # branch. Adding this trigger on a feature branch produces NO dispatchable
  # run until the branch (or at least this file) lands on `main` — see
  # VERIFY-LEDGER.md's Phase 5 rows, both left OPEN for exactly this reason.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy -D warnings
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Both ubuntu legs report runner OS "Linux" with an identical rustc
          # host triple, so without this they share one cache key — a build
          # script compiled on 24.04 (GLIBC 2.39) restores onto 22.04 (2.35)
          # and dies with "GLIBC_2.39 not found" (first hit: zmij, PR #17).
          key: ${{ matrix.os }}
      - name: cargo test --workspace
        # Excludes #[ignore]d torture heavy run; torture_smoke still runs here.
        # On Ubuntu legs this also compiles + runs the Linux-only doctor paths
        # (inotify headroom pass branch, 0700/0600 perms) — AC I++1. The
        # inotify FAIL branch needs an induced-low ceiling; see the
        # inotify-low-watches job below (AC Y++2).
        #
        # --no-fail-fast: run EVERY test binary even after one fails. Without it
        # cargo stops at the first failing binary, so a failure in `integration`
        # masks one in `torture` entirely (torture_smoke never runs) — every
        # such collision costs a CI round-trip. See CLAUDE.md "PR #2 CI-red fix".
        #
        # --test-threads=3: `cli/tests/integration.rs` spawns real `agentrec
        # record` daemons (each arms its own notify/FSEvents watch) from many
        # tests; at full default parallelism (== runner CPU count) roughly 6
        # of those daemon-heavy tests contend on the OS file-watch layer and
        # flake together — a known, pre-existing, environmental flake (see
        # CLAUDE.md "agentrec daemon-test FSEvents contention"), not a product
        # race (one daemon per root; the contention is the test harness
        # co-locating many daemons on one host). It was observed on a
        # high-core *local* macOS dev box, where the default thread count
        # (>>3) let a whole batch spawn at once.
        #
        # HONEST scope of this cap on CI, per platform:
        #  - macOS-14 GitHub runners are 3-vCPU, so the Rust default is already
        #    3 — this cap is a NO-OP there. The flake is not expected on CI
        #    macOS precisely because 3 concurrent daemons is already the
        #    ceiling; if it ever reproduces on CI macOS, THIS LINE DOES NOT FIX
        #    IT (lower the number then).
        #  - Ubuntu runners have more headroom (4), so the cap actually trims
        #    inotify-backed contention there from 4 -> 3.
        # `-- --test-threads=N` is forwarded to every test binary in this one
        # invocation — a single-line, workspace-wide cap rather than splitting
        # `integration` into its own step; the lighter suites are cheap enough
        # that capping their parallelism too costs negligible wall time, and a
        # flat cap can't silently drop a future test target the way an explicit
        # `--test <name>` allowlist would.
        #
        # NOTE: validated locally (integration 86/0 at --test-threads=3 on a
        # high-core Mac); this workflow change itself has NOT yet run on a
        # GitHub runner (batch unpushed) — treat as pending CI verification.
        run: cargo test --workspace --all-features --no-fail-fast -- --test-threads=3
      - name: cargo test rebuild_count_is_bounded_by_writes (observed count)
        # Residuals round, Phase 5: the main step above already runs this
        # test, but a passing test's stdout is captured by cargo and never
        # reaches the log — so a green run of the step above carries no
        # number for the rebuild-bound residual (Linux 1..=45 / macOS
        # 1..=10, see the platform-measurement comment on the test itself).
        # This dedicated `--nocapture` run puts the observed count in the
        # log on every green CI run, closing the single-VM-statistics gap
        # named in VERIFY-LEDGER.md.
        run: |
          cargo test -p agentrec --test integration --all-features \
            rebuild_count_is_bounded_by_writes -- --exact --nocapture

  inotify-low-watches:
    name: doctor inotify headroom (induced low watches, AC Y++2)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: lower fs.inotify.max_user_watches
        # Ephemeral CI VM — safe to mutate system-wide. 1 is strictly below a
        # fresh `init`'s dir count (root + .agentrec + .agentrec/objects ≈ 3).
        run: |
          sudo sysctl -w fs.inotify.max_user_watches=1
          sysctl fs.inotify.max_user_watches
      - name: cargo test doctor_inotify_low_watches_fails
        run: |
          cargo test -p agentrec --test integration --all-features \
            -- --ignored --exact doctor_inotify_low_watches_fails
